<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NORA — 清晰看见每一笔税</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1a17;
      --foam: #f2f7f4;
      --mist: #d7e8df;
      --leaf: #1f6b4f;
      --leaf-deep: #134836;
      --sun: #e8c26a;
      --line: rgba(14, 26, 23, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: var(--foam);
      line-height: 1.55;
      overflow-x: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    /* —— Nav —— */
    .nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 6vw;
      animation: fadeDown 0.8s ease both;
    }
    .brand {
      font-family: "Instrument Serif", serif;
      font-size: 1.85rem;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      font-size: 0.92rem;
      font-weight: 500;
      opacity: 0.85;
    }
    .nav-links a:hover {
      opacity: 1;
    }
    /* —— Hero —— */
    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      align-items: end;
      padding: 0 6vw 8vh;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(232, 194, 106, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 15% 80%, rgba(31, 107, 79, 0.18), transparent 50%),
        linear-gradient(165deg, #eaf3ee 0%, #d5e6dc 45%, #c5d9ce 100%);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(14, 26, 23, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 26, 23, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      pointer-events: none;
    }
    .hero-orb {
      position: absolute;
      width: min(58vw, 520px);
      height: min(58vw, 520px);
      right: -4vw;
      top: 8vh;
      border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
      background:
        linear-gradient(135deg, var(--leaf) 0%, var(--leaf-deep) 55%, #0a2e24 100%);
      box-shadow: inset -30px -40px 80px rgba(0, 0, 0, 0.25);
      animation: morph 12s ease-in-out infinite, drift 9s ease-in-out infinite alternate;
      opacity: 0.92;
    }
    .hero-orb::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(232, 194, 106, 0.45), transparent 60%);
      filter: blur(2px);
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      max-width: 34rem;
      padding-bottom: 1rem;
      animation: fadeUp 1s 0.15s ease both;
    }
    .hero-copy .brand-mark {
      font-family: "Instrument Serif", serif;
      font-size: clamp(4.2rem, 11vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.02em;
      margin-bottom: 1.4rem;
      color: var(--ink);
    }
    .hero-copy h1 {
      font-size: clamp(1.35rem, 2.6vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
      max-width: 18ch;
    }
    .hero-copy p {
      font-size: 1.05rem;
      opacity: 0.78;
      max-width: 32ch;
      margin-bottom: 2rem;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
      animation: fadeUp 1s 0.35s ease both;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--ink);
      color: var(--foam);
      padding: 0.85rem 1.45rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .btn-primary:hover {
      background: var(--leaf-deep);
      transform: translateY(-2px);
    }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 1.5px solid var(--ink);
      transition: opacity 0.2s;
